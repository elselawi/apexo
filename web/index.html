<!DOCTYPE html>
<html>

<head>
	<base href="/" />

	<meta charset="UTF-8" />
	<meta content="IE=Edge" http-equiv="X-UA-Compatible" />
	<meta name="description" content="Dental clinic management system" />

	<!-- iOS meta tags & icons -->
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black" />
	<meta name="apple-mobile-web-app-title" content="Apexo" />
	<link rel="apple-touch-icon" href="icons/Icon-192.png" />

	<!-- Favicon -->
	<link rel="icon" type="image/png" href="favicon.png" />

	<title>Apexo</title>
	<link rel="manifest" href="manifest.json" />
	<style>
		#progress {
			width: 92px;
			height: 122px;
			background-image: url(./icons/Icon-192.png);
			background-size: contain;
			background-repeat: no-repeat;
			background-position: center;
			animation: pulse 1s infinite ease-in-out;
			margin: 0 auto;
			margin-top: 30%;
			font-size: 12px;
			text-transform: uppercase;
			text-align: center;
			font-family: monospace;
			color: #e3e3e3;
		}

		@keyframes pulse {

			0%,
			100% {
				transform: scale(1);
				opacity: 1;
			}

			50% {
				transform: scale(1.2);
				opacity: 0.8;
			}
		}

		#fcm-custom-container {
			position: absolute;
			z-index: 9999;
			top: 20%;
			left: 50%;
			transform: translate(-50%, -50%);
			display: none;
			font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
			animation: fluentFadeIn 0.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
		}

		@keyframes fluentFadeIn {
			0% {
				opacity: 0;
				transform: translate(-50%, calc(-50% + 20px));
			}

			100% {
				opacity: 1;
				transform: translate(-50%, -50%);
			}
		}

		.fcm-dialog {
			background: rgba(243, 243, 243, 0.95);
			backdrop-filter: blur(40px);
			-webkit-backdrop-filter: blur(40px);
			padding: 24px;
			border-radius: 8px;
			border: 1px solid rgba(0, 0, 0, 0.1);
			/* Fluent Depth Shadow 32 */
			box-shadow: 0 32px 64px rgba(0, 0, 0, 0.14), 0 0 2px rgba(0, 0, 0, 0.2);
			width: 300px;
			max-width: 90vw;
		}

		.fcm-dialog p.fcm-title {
			margin: 0 0 12px 0;
			font-size: 20px;
			font-weight: 600;
			color: #1a1a1a;
		}

		.fcm-dialog p.fcm-subtitle {
			margin: 0 0 24px 0;
			font-size: 14px;
			font-weight: 400;
			color: #3b3b3b;
			line-height: 1.5;
		}

		.fcm-buttons {
			display: flex;
			gap: 8px;
			justify-content: flex-end;
		}

		.fcm-btn {
			padding: 6px 24px;
			border-radius: 4px;
			font-size: 14px;
			font-weight: 400;
			cursor: pointer;
			min-width: 90px;
			transition: all 0.1s ease-in-out;
		}

		#btn-grant-fcm {
			background-color: #006abc;
			color: #ffffff;
			border: 1px solid transparent;
			border-top-color: rgba(255, 255, 255, 0.1);
			border-bottom-color: rgba(0, 0, 0, 0.2);
		}

		#btn-grant-fcm:hover {
			background-color: #005A9E;
		}

		#btn-grant-fcm:active {
			background-color: #004C87;
			color: rgba(255, 255, 255, 0.7);
			border-bottom-color: transparent;
		}

		#btn-later-fcm {
			background-color: #fbfbfb;
			color: #1a1a1a;
			border: 1px solid rgba(0, 0, 0, 0.1);
			border-bottom-color: rgba(0, 0, 0, 0.2);
		}

		#btn-later-fcm:hover {
			background-color: #f6f6f6;
		}

		#btn-later-fcm:active {
			background-color: #f0f0f0;
			color: rgba(26, 26, 26, 0.7);
			border-bottom-color: rgba(0, 0, 0, 0.1);
		}
	</style>
</head>

<body>
	<div id="progress">Apexo</div>

	<div id="fcm-custom-container">
		<div class="fcm-dialog" id="fcm-dialog-box">
			<p class="fcm-title" id="fcm-lbl-title">Stay Updated</p>
			<p class="fcm-subtitle" id="fcm-lbl-subtitle">Enable notifications so you never miss an important update for
				Apexo.</p>

			<div class="fcm-buttons">
				<button class="fcm-btn" id="btn-later-fcm">Not Now</button>
				<button class="fcm-btn" id="btn-grant-fcm">Enable</button>
			</div>
		</div>
	</div>
	<script type="text/javascript">
		window.onload = function () {
			setTimeout(function () {
				document.getElementById('progress').remove();
			}, 1000 * 10);
		};
	</script>

	<script type="module" src="./fcm/fcm.js"></script>
	<script>
		function reloadIfPathBuilderError(event) {
			var errorMsg = event.message || (event.reason ? (event.reason.message || event.reason) : "");
			var fallbackMsg = event.toString ? event.toString() : "";
			var totalMessage = errorMsg + fallbackMsg;
			if (totalMessage.indexOf('PathBuilder') !== -1) {
				var reloadCount = parseInt(sessionStorage.getItem('canvaskit_reload_count') || '0');
				if (reloadCount < 3) {
					sessionStorage.setItem('canvaskit_reload_count', (reloadCount + 1).toString());
					window.location.reload();
				}
			}
		}
		window.addEventListener('error', reloadIfPathBuilderError, true);
		window.addEventListener('unhandledrejection', reloadIfPathBuilderError, true);
	</script>
	<script src="flutter_bootstrap.js" async></script>
</body>

</html>
