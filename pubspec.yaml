name: apexo
description: "Dental Clinic Management System"
publish_to: "none"

version: 0.17.1

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hive: ^2.2.3
  http: ^1.2.2
  fluent_ui: 4.17.0
  hive_flutter: ^1.1.0
  intl: 0.20.3
  table_calendar: ^3.3.0
  logging: ^1.3.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  fl_chart: ^1.3.0
  pocketbase: ^0.25.3
  file_picker: ^13.3.2
  qr_flutter: ^4.1.0
  printing: ^5.15.1
  pdf: ^3.13.1
  bidi: ^2.0.13
  url_launcher: ^6.3.3
  flutter_launcher_icons: ^0.14.4
  path: ^1.9.0
  http_parser: ^4.1.2
  package_info_plus: ^10.2.2
  image: ^4.12.0
  sentry_flutter: ^10.3.0
  path_drawing: ^1.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^23.0.0
  web: ^1.1.2
  toastification: ^3.2.2
  ffi: ^2.2.0
  currency_text_input_formatter: ^2.3.3
  phone_numbers_parser: ^9.0.29
  country_flags: ^4.1.2
  xml: ^7.1.0
  record: ^7.1.2
  shamsi_date: ^1.0.3
  dicom_toolkit: ^0.3.1
  web_socket_channel: ^3.0.3
  crypto: 3.0.8
  timezone: 0.11.2
  unorm_dart: 0.3.3
  material_ui: ^1.10.0
  cupertino_ui: ^1.1.6

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.2
  yaml: ^3.1.4
  msix: ^3.18.0
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8

msix_config:
  display_name: Apexo.app
  identity_name: alisaleem.apexo.app
  logo_path: assets/app_icon.png
  build_windows: false
  publisher: "CN=275027E7-AE47-4DEE-B3D6-0BE5AF8D773E"
  publisher_display_name: "alisaleem"
  capabilities: internetClient
  # Local toast clicks are routed back to the app through this COM server. The
  # CLSID is the one in lib/services/notifications/windows_notification_identity.dart
  # (WindowsNotificationIdentity.activationGuid) — it is NOT the push activator
  # class id, which is the Azure application id added by
  # tools/patch_push_manifest.dart.
  toast_activator:
    clsid: 51fc2ec1-f21e-4b3c-9f2b-71c28c7b0f7e
    display_name: Apexo notifications
    arguments: ----AppNotificationActivationServer

flutter:
  fonts:
    - family: DentalIcons
      fonts:
        - asset: assets/fonts/DentalIcons.ttf
  uses-material-design: true
  assets:
    - CHANGELOG.md
    - assets/app_icon.png
    - assets/images/logo.png
    - assets/images/missing.png
    - assets/fonts/readex.ttf
    - assets/fonts/readex-bold.ttf
    - assets/fonts/DentalIcons.ttf
    - assets/ding.wav
    - shorebird.yaml
