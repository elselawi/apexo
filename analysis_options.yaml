include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    dead_code: error
    unused_import: error
    unused_local_variable: error
    unused_element: error
    unused_field: error
    unused_shown_name: error
    unused_label: error

    # Async correctness
    discarded_futures: error
    unawaited_futures: error
    cancel_subscriptions: error
    close_sinks: error

    # Type/API correctness
    invalid_assignment: error
    argument_type_not_assignable: error
    return_of_invalid_type: error
    undefined_class: error
    undefined_function: error
    undefined_method: error
    undefined_named_parameter: error
    undefined_getter: error
    undefined_setter: error

linter:
  rules:
    # ---------------------------------------------------------------------------
    # API / LIBRARY QUALITY
    # ---------------------------------------------------------------------------

    - always_declare_return_types
    - annotate_overrides
    - avoid_annotating_with_dynamic
    - avoid_dynamic_calls
    - library_private_types_in_public_api
    # NOT enabled here, deliberately:
    #   * `public_member_api_docs` / `package_api_docs` are *library* lints. This is an
    #     application: `lib/src/**` is private by convention and only `lib/dentalmesh_app.dart`
    #     is a barrel, so the rule asks for doc comments on ~300 internal widgets. The four
    #     `packages/*` are the published surface — enable it there if we want it.
    #     (`package_api_docs` was also removed from the SDK in Dart 3.7.)
    #   * `always_put_required_named_parameters_first` conflicts with Flutter's own
    #     convention that `key` is the first parameter of a widget constructor, which is why
    #     `flutter_lints` does not enable it. It flagged 78 `{super.key, required ...}`
    #     constructors.

    # ---------------------------------------------------------------------------
    # TYPE SAFETY
    # ---------------------------------------------------------------------------

    - avoid_types_as_parameter_names
    - cast_nullable_to_non_nullable
    - hash_and_equals
    - test_types_in_equals
    - tighten_type_of_initializing_formals

    # ---------------------------------------------------------------------------
    # ASYNC / RESOURCE MANAGEMENT
    # ---------------------------------------------------------------------------

    - unawaited_futures
    - discarded_futures
    - cancel_subscriptions
    - close_sinks
    - avoid_slow_async_io

    # ---------------------------------------------------------------------------
    # IMMUTABILITY / STATE
    # ---------------------------------------------------------------------------

    - prefer_final_fields
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # ---------------------------------------------------------------------------
    # CONTROL FLOW / CORRECTNESS
    # ---------------------------------------------------------------------------

    - literal_only_boolean_expressions
    - unnecessary_this
    - unnecessary_const
    - unnecessary_new
    - no_adjacent_strings_in_list

    # ---------------------------------------------------------------------------
    # DESIGN / MAINTAINABILITY
    # ---------------------------------------------------------------------------

    - avoid_setters_without_getters
    - avoid_unnecessary_containers
    - prefer_asserts_with_message
    - use_enums

    # ---------------------------------------------------------------------------
    # NAMING / DOCUMENTATION / STYLE
    # ---------------------------------------------------------------------------

    - prefer_single_quotes
    - slash_for_doc_comments
    - sort_constructors_first

    # ---------------------------------------------------------------------------
    # GENERAL QUALITY
    # ---------------------------------------------------------------------------

    - avoid_print
    - prefer_expression_function_bodies
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_contains
    - prefer_if_null_operators
    - prefer_null_aware_operators
    - use_string_buffers
    - use_super_parameters
