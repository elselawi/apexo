# still apply the Kotlin Gradle plugin themselves -- image_picker_android,
# package_info_plus, record_android, sentry_flutter -- so see android/build.gradle
# for the narrower file_picker fix instead.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
